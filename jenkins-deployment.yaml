apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: us-central1-docker.pkg.dev/ca-tasks/jenkinsdemo/todo-app:latest
          ports:
            - containerPort: 80
